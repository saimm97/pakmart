openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PakMart e-commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: catalog
  - name: cart
  - name: orders
  - name: home
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /home/feed:
    get:
      operationId: getHomeFeed
      tags: [home]
      summary: Aggregated home page feed
      responses:
        "200":
          description: Home feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeFeed" }

  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /categories/{slug}:
    get:
      operationId: getCategory
      tags: [catalog]
      summary: Get a category by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /brands:
    get:
      operationId: listBrands
      tags: [catalog]
      summary: List top brands
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Brand" }

  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products with filters
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: Category slug
        - name: brand
          in: query
          required: false
          schema: { type: string }
          description: Brand slug
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: minPrice
          in: query
          required: false
          schema: { type: integer }
        - name: maxPrice
          in: query
          required: false
          schema: { type: integer }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [popular, newest, price_asc, price_desc, rating]
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }

  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /products/{slug}/related:
    get:
      operationId: getRelatedProducts
      tags: [catalog]
      summary: Get related products
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /deals/flash:
    get:
      operationId: getFlashDeal
      tags: [catalog]
      summary: Current flash deal with countdown
      responses:
        "200":
          description: Flash deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlashDeal" }

  /testimonials:
    get:
      operationId: listTestimonials
      tags: [catalog]
      summary: Customer testimonials
      responses:
        "200":
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Testimonial" }

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemBody" }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCartItemBody" }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove cart item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /cart/clear:
    post:
      operationId: clearCart
      tags: [cart]
      summary: Empty the cart
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place order from current cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderBody" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Category:
      type: object
      required: [id, slug, name, image, icon, productCount]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        image: { type: string }
        icon: { type: string, description: "lucide-react icon name" }
        productCount: { type: integer }

    Brand:
      type: object
      required: [id, slug, name, productCount]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        productCount: { type: integer }

    Product:
      type: object
      required:
        - id
        - slug
        - name
        - brand
        - brandSlug
        - description
        - price
        - discount
        - image
        - images
        - rating
        - reviewCount
        - stock
        - sold
        - categoryName
        - categorySlug
        - isFlashDeal
        - isNew
        - isFeatured
        - tags
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        brandSlug: { type: string }
        description: { type: string }
        price: { type: integer }
        oldPrice: { type: ["integer", "null"] }
        discount: { type: integer }
        image: { type: string }
        images:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        stock: { type: integer }
        sold: { type: integer }
        categoryName: { type: string }
        categorySlug: { type: string }
        isFlashDeal: { type: boolean }
        isNew: { type: boolean }
        isFeatured: { type: boolean }
        tags:
          type: array
          items: { type: string }

    ProductList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total: { type: integer }

    FlashDeal:
      type: object
      required: [endsAt, items]
      properties:
        endsAt:
          type: string
          format: date-time
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    Testimonial:
      type: object
      required: [id, name, city, rating, comment, initials]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        rating: { type: integer }
        comment: { type: string }
        initials: { type: string }

    HomeFeed:
      type: object
      required:
        - flashDeal
        - categories
        - newArrivals
        - trending
        - featured
        - topBrands
        - testimonials
      properties:
        flashDeal: { $ref: "#/components/schemas/FlashDeal" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        newArrivals:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        trending:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        featured:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        topBrands:
          type: array
          items: { $ref: "#/components/schemas/Brand" }
        testimonials:
          type: array
          items: { $ref: "#/components/schemas/Testimonial" }

    CartItem:
      type: object
      required:
        - id
        - productId
        - productSlug
        - productName
        - productBrand
        - productImage
        - price
        - quantity
        - stock
        - lineTotal
      properties:
        id: { type: integer }
        productId: { type: integer }
        productSlug: { type: string }
        productName: { type: string }
        productBrand: { type: string }
        productImage: { type: string }
        price: { type: integer }
        quantity: { type: integer }
        stock: { type: integer }
        lineTotal: { type: integer }

    Cart:
      type: object
      required:
        - items
        - itemCount
        - subtotal
        - deliveryFee
        - discount
        - total
        - freeDeliveryThreshold
        - amountToFreeDelivery
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        itemCount: { type: integer }
        subtotal: { type: integer }
        deliveryFee: { type: integer }
        discount: { type: integer }
        total: { type: integer }
        freeDeliveryThreshold: { type: integer }
        amountToFreeDelivery: { type: integer }

    AddCartItemBody:
      type: object
      required: [productId]
      properties:
        productId: { type: integer }
        quantity: { type: integer }

    UpdateCartItemBody:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer }

    OrderItem:
      type: object
      required:
        - id
        - productId
        - productSlug
        - productName
        - productBrand
        - productImage
        - price
        - quantity
        - lineTotal
      properties:
        id: { type: integer }
        productId: { type: integer }
        productSlug: { type: string }
        productName: { type: string }
        productBrand: { type: string }
        productImage: { type: string }
        price: { type: integer }
        quantity: { type: integer }
        lineTotal: { type: integer }

    CreateOrderBody:
      type: object
      required: [fullName, phone, address, city, paymentMethod]
      properties:
        fullName: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        address: { type: string }
        city: { type: string }
        paymentMethod:
          type: string
          enum: [cod, easypaisa, jazzcash, card]
        notes: { type: ["string", "null"] }

    Order:
      type: object
      required:
        - id
        - orderNumber
        - status
        - fullName
        - phone
        - address
        - city
        - paymentMethod
        - subtotal
        - deliveryFee
        - discount
        - total
        - items
        - createdAt
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        fullName: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        address: { type: string }
        city: { type: string }
        paymentMethod: { type: string }
        notes: { type: ["string", "null"] }
        subtotal: { type: integer }
        deliveryFee: { type: integer }
        discount: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        createdAt:
          type: string
          format: date-time
